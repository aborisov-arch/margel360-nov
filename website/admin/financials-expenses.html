<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Финанси · Разходи — Маргел 360° Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=12">
  <link rel="stylesheet" href="css/financials.css?v=4">
</head>
<body>
  <header class="admin-header">
    <a href="dashboard.html" class="admin-logo">МАРГЕЛ <span>360°</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html" data-i18n="nav_enquiries">Запитвания</a>
      <a href="customers.html" data-i18n="nav_customers">Клиенти</a>
      <a href="calendar.html" data-i18n="nav_calendar">Календар</a>
      <a href="feedback.html">Впечатления</a>
      <a href="marketing.html" data-i18n="nav_marketing">Маркетинг</a>
      <a href="financials.html" class="active" data-i18n="nav_financials">Финанси</a>
    </nav>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="bg">БГ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="btn btn-outline btn-sm" id="logout-btn" data-i18n="nav_logout">Изход</button>
  </header>

  <main class="admin-main fin">
    <div class="admin-container">
      <div class="fin-breadcrumb">
        <a href="financials.html">← Назад към обобщение</a>
      </div>
      <h1 class="page-title">Разходи</h1>

      <div class="fin-toolbar">
        <div class="fin-toolbar__field">
          <label for="fin-month">Месец</label>
          <input type="month" id="fin-month">
        </div>
        <span class="fin-toolbar__rate"><strong>1 €</strong> = 1.95583 лв · фиксиран курс</span>
      </div>

      <section class="fin-section">
        <div class="fin-section__head">
          <h2>Разходи</h2>
          <span class="count" id="expenses-count">—</span>
          <span class="fin-section__hint">По категория</span>
        </div>
        <div class="ledger-wrap">
          <table class="ledger ledger--expenses" id="expenses-table">
            <thead>
              <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Описание</th>
                <th class="num">Сума €</th>
                <th class="num">Сума лв</th>
                <th class="actions-col"></th>
              </tr>
            </thead>
            <tbody id="expenses-body"></tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="3">Общо разходи</td>
                <td class="num" id="ex-tot-eur">€0.00</td>
                <td class="num col-bgn" id="ex-tot-bgn">лв 0.00</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="fin-actions">
          <button type="button" class="btn-add" id="btn-add-expense" onclick="window.addManualExpense && window.addManualExpense()">+ Добави разход</button>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js?v=3" defer></script>
  <script src="js/admin-i18n.js?v=5" defer></script>
  <script src="js/auth.js?v=2" defer></script>
  <script src="js/financials.js?v=15" defer></script>
</body>
</html>
