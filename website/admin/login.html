<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход - Маргел 360° Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=17">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body class="login-page">
  <main>
    <div class="login-card">
      <div class="login-logo">МАРГЕЛ <span>360°</span></div>
      <h1 class="login-title" data-i18n="login_title">Административен панел</h1>
      <div class="lang-toggle login-lang">
        <button class="lang-btn" data-lang="bg">БГ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" data-i18n="login_email">Имейл</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login_password">Парола</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <!-- Cloudflare Turnstile (managed mode - invisible for most). When
             Supabase Auth CAPTCHA protection is enabled, the token is
             required server-side; until then it's accepted and ignored. -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADjSB9200ZicBIRp" data-language="auto" style="margin:14px 0 4px"></div>
        <p class="login-error" id="login-error" role="alert" style="display:none"></p>
        <p id="login-info" role="status" style="display:none;color:#2E7D32;text-align:center;font-size:0.88rem;margin:0 0 4px"></p>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn" data-i18n="login_btn">Вход</button>
        <button type="button" id="forgot-link" style="display:block;margin:14px auto 0;background:none;border:none;color:#B9894A;font-size:0.85rem;cursor:pointer;text-decoration:underline">Забравена парола?</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7" integrity="sha384-tD6X9wDfTRdKpuPoHFZrVW2RXjSYSWjLBPWXxpHprWWl9eaHlwl05aRjHsiKF97n" crossorigin="anonymous"></script>
  <script src="js/supabase-client.js?v=2"></script>
  <script src="js/admin-i18n.js?v=19"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="js/login.js?v=3"></script>
</body>
</html>
