[build]
  base = "website"
  publish = "."

# Security headers applied to every response. CSP allows the inline
# scripts the site currently uses + the third-party origins it talks to
# (Supabase, Resend not from browser, Google Fonts, jsDelivr CDN for
# flatpickr / supabase-js / xlsx). Tighten when we move away from
# 'unsafe-inline' on scripts (large change — covered separately).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.sheetjs.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://wlxutsufrobzovdsiecb.supabase.co wss://wlxutsufrobzovdsiecb.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Admin pages get extra-strict no-cache + same security headers above.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
