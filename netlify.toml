[build]
  base = "website"
  publish = "."

# drinks.html was an orphaned near-duplicate of menu.html (SEO audit
# 2026-07-13). force = true because the file still exists on disk.
[[redirects]]
  from = "/drinks.html"
  to = "/menu.html"
  status = 301
  force = true

# The pre-2026 site was WooCommerce; Google still has its /product/ pages
# indexed (drinks catalog). 301 the legacy shop paths to the drinks menu so
# old links land somewhere useful and the index consolidates faster
# (GSC cleanup, 2026-07-16).
[[redirects]]
  from = "/product/*"
  to = "/menu.html"
  status = 301

[[redirects]]
  from = "/product-category/*"
  to = "/menu.html"
  status = 301

[[redirects]]
  from = "/shop/*"
  to = "/menu.html"
  status = 301

# Old WP "Тип събития" page, still indexed (site: check 2026-07-17).
# Netlify matches non-ASCII paths only in percent-encoded form; the literal
# Cyrillic `from` never matched (verified live). Splat covers with/without
# trailing slash.
[[redirects]]
  from = "/%D1%82%D0%B8%D0%BF-%D1%81%D1%8A%D0%B1%D0%B8%D1%82%D0%B8%D1%8F*"
  to = "/"
  status = 301

# Caching for static assets (SEO audit: everything was max-age=0 and every
# visit re-validated every file). css/js get 7 days, NOT immutable/1y: the
# ?v= bump rule guards freshness, but version drift has happened before
# (venue.css v2/v4/v5 across pages), and /js/* is also reached from admin
# pages via ../js/ (outside the /admin/* no-store rule) — a missed bump
# must self-heal in days, not a year. Images: 30 days (stable filenames,
# occasionally replaced in place, e.g. favicons). HTML keeps Netlify's
# default revalidation.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Admin entry points. /admin/ has no index page, and /admin/security.html
# was removed with the 2FA rollback — send both (and the no-slash form) to
# the login, which routes on to the dashboard when a session exists.
# force = false so real admin files (login.html, dashboard.html, …) are
# still served normally; only missing paths fall through to these.
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 301

[[redirects]]
  from = "/admin/security.html"
  to = "/admin/login.html"
  status = 301

# Security headers applied to every response. CSP allows the inline
# scripts the site currently uses + the third-party origins it talks to
# (Supabase, Resend not from browser, Google Fonts, jsDelivr CDN for
# flatpickr / supabase-js / xlsx). Tighten when we move away from
# 'unsafe-inline' on scripts (large change — covered separately).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.googleadservices.com https://www.google-analytics.com https://ssl.google-analytics.com https://googleads.g.doubleclick.net https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://wlxutsufrobzovdsiecb.supabase.co wss://wlxutsufrobzovdsiecb.supabase.co https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://googleads.g.doubleclick.net https://www.google.com https://pagead2.googlesyndication.com https://www.googleadservices.com https://www.facebook.com https://connect.facebook.net; frame-src https://challenges.cloudflare.com https://td.doubleclick.net https://www.googletagmanager.com https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Admin pages get extra-strict no-cache + same security headers above.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
