<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Смяна на парола - Маргел 360° Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=18">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body class="login-page">
  <main>
    <div class="login-card">
      <div class="login-logo">МАРГЕЛ <span>360°</span></div>
      <h1 class="login-title">Задаване на нова парола</h1>

      <div id="reset-loading" style="text-align:center;color:#777;padding:12px 0">Зареждане…</div>

      <div id="reset-invalid" style="display:none;text-align:center;color:#555;line-height:1.6">
        <p>Линкът е невалиден или изтекъл.</p>
        <p><a href="login.html">Към входа</a> - поискайте нов линк с „Забравена парола?".</p>
      </div>

      <form id="reset-form" novalidate style="display:none">
        <div class="form-group">
          <label for="new-password">Нова парола (поне 8 символа)</label>
          <input type="password" id="new-password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Потвърдете паролата</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required>
        </div>
        <p class="login-error" id="reset-msg" role="alert" style="display:none"></p>
        <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Запази паролата</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7" integrity="sha384-tD6X9wDfTRdKpuPoHFZrVW2RXjSYSWjLBPWXxpHprWWl9eaHlwl05aRjHsiKF97n" crossorigin="anonymous"></script>
  <script src="js/supabase-client.js?v=2"></script>
  <script src="js/reset.js?v=2"></script>
</body>
</html>
