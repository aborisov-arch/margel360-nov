<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Календар — Маргел 360° Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=16">
  <style>
    .cal-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
    @media (max-width: 980px) { .cal-layout { grid-template-columns: 1fr; } }
    .cal-side {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 20px;
    }
    .cal-side h3 {
      font: 600 0.78rem/1.4 'Inter', sans-serif; letter-spacing: 0.06em;
      text-transform: uppercase; color: #71717a;
      margin: 0 0 14px;
    }
    .cal-bookings { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .cal-booking {
      display: flex; flex-direction: column; gap: 2px;
      padding: 10px 12px;
      background: #fafafa;
      border: 1px solid #f1efeb;
      border-radius: 8px;
      font-size: 0.88rem;
      transition: border-color 0.15s ease, background 0.15s ease;
      cursor: pointer;
      text-align: left;
    }
    .cal-booking:hover { border-color: rgba(201,168,76,0.35); background: #fff; }
    .cal-booking__date {
      font: 600 0.78rem/1 'Inter', sans-serif;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .cal-booking__name { font-weight: 500; color: var(--text); }
    .cal-booking__type { color: #71717a; font-size: 0.78rem; }
    .cal-booking.unnamed {
      background: transparent; border-style: dashed;
    }
    .cal-booking.unnamed .cal-booking__name { color: #a3a09a; font-style: italic; }
    .cal-side .empty { color: #a3a09a; font-style: italic; font-size: 0.88rem; }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
  <header class="admin-header">
    <a href="dashboard.html" class="admin-logo">МАРГЕЛ <span>360°</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html" data-i18n="nav_enquiries">Запитвания</a>
      <a href="customers.html" data-i18n="nav_customers">Клиенти</a>
      <a href="calendar.html" class="active" data-i18n="nav_calendar">Календар</a>
      <a href="feedback.html">Впечатления</a>
      <a href="partners.html" data-i18n="nav_partners">Партньори</a>
      <a href="marketing.html" data-i18n="nav_marketing">Маркетинг</a>
      <a href="financials.html" data-i18n="nav_financials">Финанси</a>
      <a href="activity.html" class="owner-only" hidden data-i18n="nav_activity">Дневник</a>
    </nav>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="bg">БГ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="btn btn-outline btn-sm" id="logout-btn" data-i18n="nav_logout">Изход</button>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <h1 class="page-title" data-i18n="cal_title">Заети дати</h1>
      <p class="page-sub" data-i18n="cal_sub">Натиснете дата, за да я отбележите като заета. Натиснете отново за отмяна.</p>
      <div class="calendar-controls">
        <button class="btn btn-outline btn-sm" id="prev-month" aria-label="Previous month">
          <span aria-hidden="true">←</span> <span data-i18n="cal_prev">Назад</span>
        </button>
        <h2 id="calendar-month" class="cal-month-label">…</h2>
        <button class="btn btn-outline btn-sm" id="next-month" aria-label="Next month">
          <span data-i18n="cal_next">Напред</span> <span aria-hidden="true">→</span>
        </button>
      </div>
      <div class="cal-layout">
        <div>
          <div class="calendar-grid" id="calendar-grid"></div>
          <div class="cal-legend">
            <span><span class="legend-dot occupied"></span><span data-i18n="cal_occupied">Заето</span></span>
            <span><span class="legend-dot available"></span><span data-i18n="cal_available">Свободно</span></span>
          </div>
        </div>
        <aside class="cal-side">
          <h3>Резервации</h3>
          <div class="cal-bookings" id="cal-bookings">
            <div class="empty">Зареждане…</div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7" integrity="sha384-tD6X9wDfTRdKpuPoHFZrVW2RXjSYSWjLBPWXxpHprWWl9eaHlwl05aRjHsiKF97n" crossorigin="anonymous" defer></script>
  <script src="js/supabase-client.js?v=3" defer></script>
  <script src="js/admin-i18n.js?v=16" defer></script>
  <script src="js/auth.js?v=5" defer></script>
  <script src="js/calendar.js?v=4" defer></script>
</body>
</html>
