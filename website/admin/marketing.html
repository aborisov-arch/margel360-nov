<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Маркетинг експорт — Маргел 360° Админ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=15">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
  <header class="admin-header">
    <a href="dashboard.html" class="admin-logo">МАРГЕЛ <span>360°</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html" data-i18n="nav_enquiries">Запитвания</a>
      <a href="customers.html" data-i18n="nav_customers">Клиенти</a>
      <a href="calendar.html" data-i18n="nav_calendar">Календар</a>
      <a href="feedback.html">Впечатления</a>
      <a href="marketing.html" class="active" data-i18n="nav_marketing">Маркетинг</a>
      <a href="financials.html" data-i18n="nav_financials">Финанси</a>
      <a href="activity.html" class="owner-only" hidden>Дневник</a>
    </nav>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="bg">БГ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="btn btn-outline btn-sm" id="logout-btn" data-i18n="nav_logout">Изход</button>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <h1 class="page-title" data-i18n="marketing_title">Маркетинг експорт</h1>
      <p class="page-sub" data-i18n="marketing_lead" style="max-width:720px;color:#666">Свалете CSV с уникални клиенти — дедупликирани по имейл (после по телефон). Всеки ред обединява всички запитвания от този контакт.</p>

      <div class="marketing-card">
        <label>
          <input type="checkbox" id="filter-consent">
          <span data-i18n="marketing_filter_consent">Само клиенти със съгласие за маркетинг</span>
        </label>
        <label>
          <span data-i18n="marketing_filter_status">Етап в пайплайна:</span>
          <select id="filter-status">
            <option value="" data-i18n="marketing_filter_any">Всички</option>
            <option value="new">Ново</option>
            <option value="contacted">Свързан</option>
            <option value="quoted">С оферта</option>
            <option value="confirmed">Потвърдено</option>
            <option value="completed">Проведено</option>
          </select>
        </label>
        <label>
          <span data-i18n="marketing_filter_event">Тип събитие:</span>
          <select id="filter-event">
            <option value="" data-i18n="marketing_filter_any">Всички</option>
          </select>
        </label>
        <div style="margin-top:16px">
          <button class="btn btn-primary" id="download-csv" data-i18n="marketing_download_csv">Свали CSV</button>
          <span data-i18n="marketing_count_label">Намерени клиенти</span>: <span id="match-count" class="marketing-count">—</span>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7" integrity="sha384-tD6X9wDfTRdKpuPoHFZrVW2RXjSYSWjLBPWXxpHprWWl9eaHlwl05aRjHsiKF97n" crossorigin="anonymous" defer></script>
  <script src="js/supabase-client.js?v=3" defer></script>
  <script src="js/admin-i18n.js?v=13" defer></script>
  <script src="js/auth.js?v=5" defer></script>
  <script src="js/marketing.js?v=3" defer></script>
</body>
</html>
