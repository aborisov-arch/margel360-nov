[build]
  base = "website"
  publish = "."

# Admin entry points. /admin/ has no index page, and /admin/security.html
# was removed with the 2FA rollback — send both (and the no-slash form) to
# the login, which routes on to the dashboard when a session exists.
# force = false so real admin files (login.html, dashboard.html, …) are
# still served normally; only missing paths fall through to these.
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 301

[[redirects]]
  from = "/admin/security.html"
  to = "/admin/login.html"
  status = 301

# Security headers applied to every response. CSP allows the inline
# scripts the site currently uses + the third-party origins it talks to
# (Supabase, Resend not from browser, Google Fonts, jsDelivr CDN for
# flatpickr / supabase-js / xlsx). Tighten when we move away from
# 'unsafe-inline' on scripts (large change — covered separately).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.googleadservices.com https://www.google-analytics.com https://ssl.google-analytics.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://wlxutsufrobzovdsiecb.supabase.co wss://wlxutsufrobzovdsiecb.supabase.co https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://googleads.g.doubleclick.net https://www.google.com https://pagead2.googlesyndication.com https://www.googleadservices.com; frame-src https://challenges.cloudflare.com https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Admin pages get extra-strict no-cache + same security headers above.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
